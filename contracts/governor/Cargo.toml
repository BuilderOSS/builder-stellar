[package]
name = "governor"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
common = { path = "../common" }
stellar-governance = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
common = { path = "../common", features = ["testutils"] }
token = { path = "../token", features = ["testutils"] }
treasury = { path = "../treasury", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
