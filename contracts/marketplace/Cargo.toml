[package]
name = "marketplace"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
common = { path = "../common" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
common = { path = "../common", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
