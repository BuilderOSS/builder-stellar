[package]
name = "minter"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
common = { path = "../common" }

[dev-dependencies]
common = { path = "../common", features = ["testutils"] }
# Reads the shared merkle test vectors (test-vectors/merkle-v1.json).
serde_json = "1"
soroban-sdk = { workspace = true, features = ["testutils"] }
token = { path = "../token", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
