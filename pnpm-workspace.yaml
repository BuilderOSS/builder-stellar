packages:
  - apps/*
  - packages/*
  - packages/*/*


# Patched versions of transitive packages whose parents pin a version with a known advisory
# (docs/DEPENDENCIES.md). Remove an entry once the parent ships the fix itself.
overrides:
  # Next 15 (8.4.31) and Panda CSS (8.5.14) pin older postcss 8 releases; same major and API.
  postcss@>=8.0.0 <8.5.23: ^8.5.23
  # Panda CSS pins these; the patched releases are the same major.
  browserslist@>=4.0.0 <4.28.7: ^4.28.7
  postcss-selector-parser@>=7.0.0 <7.1.6: ^7.1.6
  # Prisma 6.19.3 pins effect 3.21.0; 3.22 is the same major and API.
  '@prisma/config>effect': ^3.22.1
