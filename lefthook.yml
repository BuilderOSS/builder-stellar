# Lefthook configuration for builder-stellar
# Fast Git hooks manager for mixed Rust + JavaScript monorepo

pre-commit:
  parallel: true
  commands:
    # Lint and fix the staged JavaScript/TypeScript files in the web app.
    # `root` makes {staged_files} relative to apps/web, where ESLint runs.
    lint-web:
      root: "apps/web/"
      glob: "*.{js,jsx,mjs,cjs,ts,tsx}"
      run: pnpm exec eslint --fix --no-warn-ignored {staged_files}
      stage_fixed: true

    # Typecheck the web app when TypeScript changes (lint alone missed type errors).
    typecheck-web:
      root: "apps/web/"
      glob: "*.{ts,tsx}"
      run: pnpm typecheck

    # Format Rust contract files
    format-rust:
      glob: "contracts/**/*.rs"
      run: cargo fmt --all
      stage_fixed: true
