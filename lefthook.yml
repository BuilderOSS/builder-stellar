# Lefthook configuration for builder-stellar
# Fast Git hooks manager for mixed Rust + JavaScript monorepo

pre-commit:
  parallel: true
  commands:
    # Lint and fix the staged JavaScript/TypeScript files in the web app.
    # `root` makes {staged_files} relative to apps/web, where ESLint runs.
    lint-web:
      root: "apps/web/"
      glob: "*.{js,jsx,mjs,cjs,ts,tsx}"
      run: pnpm exec eslint --fix --no-warn-ignored {staged_files}
      stage_fixed: true

    # Typecheck the web app when TypeScript changes (lint alone missed type errors).
    typecheck-web:
      root: "apps/web/"
      glob: "*.{ts,tsx}"
      run: pnpm typecheck

    # Format Rust contract files
    format-rust:
      glob: "contracts/**/*.rs"
      run: cargo fmt --all
      stage_fixed: true

    # Scan staged changes for secrets with the rules CI uses (.gitleaks.toml). Without gitleaks
    # installed the hook says so and lets the commit through; CI scans every push either way.
    # Install: brew install gitleaks (or a release from github.com/gitleaks/gitleaks).
    secrets:
      run: |
        if command -v gitleaks >/dev/null 2>&1; then
          gitleaks git --pre-commit --staged --redact --no-banner .
        else
          echo "gitleaks is not installed: staged changes were not scanned for secrets (CI still scans). Install it with: brew install gitleaks"
        fi
