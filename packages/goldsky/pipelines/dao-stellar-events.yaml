name: dao-stellar-events
description: Index Manager CA43TBFYUYUZWOKZ7JA2Y4XLRTKY3UBJ4KTLMWTFBAAUHUKMZBGA6KSN on testnet with Goldsky Turbo
resource_size: s
use_dedicated_ip: false
job: false
sources:
  stellar_events:
    type: dataset
    dataset_name: stellar_testnet.events
    version: 1.2.0
    start_at: 4807257

transforms:
  dao_events:
    type: sql
    primary_key: event_id
    sql: |
      SELECT
        id AS event_id,
        'manager:CA43TBFYUYUZWOKZ7JA2Y4XLRTKY3UBJ4KTLMWTFBAAUHUKMZBGA6KSN' AS deployment_id,
        contract_id,
        CASE WHEN contract_id = 'CA43TBFYUYUZWOKZ7JA2Y4XLRTKY3UBJ4KTLMWTFBAAUHUKMZBGA6KSN' THEN 'manager' ELSE 'unknown' END AS contract_role,
        type,
        topics,
        data,
        in_successful_contract_call,
        transaction_hash,
        transaction_account,
        transaction_account_muxed,
        transaction_fee_account,
        transaction_fee_account_muxed,
        transaction_successful,
        transaction_index,
        operation_body,
        operation_result_code,
        operation_type,
        ledger_sequence,
        ledger_hash,
        ledger_closed_at,
        _gs_op
      FROM stellar_events
       WHERE ledger_sequence >= 4807257

  raw_events:
    type: script
    from: dao_events
    language: typescript
    primary_key: event_id
    schema:
      event_id: string
      deployment_id: string
      contract_id: string
      contract_role: string
      topics: string
      data: string
      transaction_hash: string
      transaction_successful: boolean
      ledger_sequence: int64
      ledger_hash: string
      ledger_closed_at: string
      transaction_index: int64
      operation_index: int64
      event_index: int64
      operation_type: string
      _gs_op: string
    script: |
      function invoke(data) {
        function stringify(value) {
          if (value === undefined || value === null) {
            return null;
          }

          if (typeof value === 'string') {
            var trimmed = value.trim();
            if ((trimmed.startsWith('{') && trimmed.endsWith('}')) || (trimmed.startsWith('[') && trimmed.endsWith(']'))) {
              return value;
            }
          }

          try {
            return JSON.stringify(value);
          } catch {
            return String(value);
          }
        }

        return {
          event_id: data.event_id || data.id,
          deployment_id: data.deployment_id || null,
          contract_id: data.contract_id || null,
          contract_role: data.contract_role || 'unknown',
          topics: stringify(data.topics),
          data: stringify(data.data ?? data.payload ?? data),
          transaction_hash: data.transaction_hash || null,
          transaction_successful: data.transaction_successful ?? null,
          ledger_sequence: data.ledger_sequence ?? null,
          ledger_hash: data.ledger_hash ?? null,
          ledger_closed_at: data.ledger_closed_at ?? null,
          transaction_index: data.transaction_index ?? null,
          operation_index: data.operation_index ?? null,
          event_index: data.event_index ?? null,
          operation_type: data.operation_type ?? null,
          _gs_op: data._gs_op ?? null
        };
      }

  decoded_events:
    type: script
    from: raw_events
    language: typescript
    primary_key: event_id
    schema:
      event_id: string
      deployment_id: string
      contract_id: string
      contract_role: string
      event_name: string
      topic_0: string
      topic_1: string
      topic_2: string
      topic_3: string
      topics: string
      args: string
      transaction_hash: string
      transaction_successful: boolean
      ledger_sequence: int64
      ledger_hash: string
      ledger_closed_at: string
      transaction_index: int64
      operation_index: int64
      event_index: int64
      operation_type: string
      _gs_op: string
      decoder_version: string
    script: |
      function invoke(data) {
        function native(value) {
          if (value === null || value === undefined || value === 'void') return null;
          if (typeof value !== 'object') return value;
          if (value.symbol !== undefined) return String(value.symbol);
          if (value.address !== undefined) return String(value.address);
          var scalar = ['u32', 'i32', 'u64', 'i64', 'u128', 'i128', 'u256', 'i256', 'bytes', 'string', 'bool'];
          for (var i = 0; i < scalar.length; i += 1) {
            if (value[scalar[i]] !== undefined) return scalar[i].match(/^[ui](64|128|256)$/) ? String(value[scalar[i]]) : value[scalar[i]];
          }
          if (Array.isArray(value.vec)) return value.vec.map(native);
          if (Array.isArray(value.map)) {
            var out = {};
            value.map.forEach(function (entry) { if (entry && entry.key !== undefined) out[String(native(entry.key))] = native(entry.val); });
            return out;
          }
          return value;
        }

        function json(value) {
          if (typeof value !== 'string') return value;
          try { return JSON.parse(value); } catch (_) { return null; }
        }

        var rawTopics = json(data.topics);
        var rawData = json(data.data);
        if (!Array.isArray(rawTopics) || rawTopics.length === 0) return null;

        var values = rawTopics.map(native);
        var eventName = String(values[0]);
        var topicValues = values.slice(1);
        var topicNames = {
          ProposalCreated: ['proposal_id', 'proposer'], VoteCast: ['voter', 'proposal_id'],
          ProposalQueued: ['proposal_id'], ProposalCancelled: ['proposal_id'], ProposalCanceled: ['proposal_id'], ProposalExecuted: ['proposal_id'],
          MintWithMinter: ['minter', 'to'], Mint: ['to'], BatchMint: ['minter', 'to'], Transfer: ['from', 'to'], Approve: ['owner', 'spender'],
          DelegateChanged: ['delegator'], DelegateVotesChanged: ['delegate'], AuctionCreated: ['token_id'], BidPlaced: ['token_id', 'bidder'],
          AuctionSettled: ['token_id'], BidRefunded: ['token_id', 'bidder'], AuctionCancelled: ['token_id'], Execute: ['governor', 'target'],
          TokenInitialized: ['owner'], MintAuthorityChanged: ['authority'], GovernorInitialized: ['owner'], TreasuryChanged: ['old_treasury', 'new_treasury'],
          TokenContractChanged: ['old_token_contract', 'new_token_contract'], GovernorAuthorityChanged: ['authority'], AuctionInitialized: ['owner'],
          TreasuryInitialized: ['owner'], GovernorChanged: ['old_governor', 'new_governor'], DaoCreated: ['token_address', 'creator'], DaoRegistered: ['token_address', 'creator'], DaoFinalized: ['token_address'],
           SeedGenerated: ['token_id'], MetadataInitialized: ['token'], ProposalExpired: [],
          ProposalThresholdChanged: ['caller'], QuorumBpsChanged: ['caller'], QueueDelayChanged: ['caller'], VotingDelayChanged: ['caller'], VotingPeriodChanged: ['caller'], DurationUpdated: [], ReservePriceUpdated: [], MinBidIncrementUpdated: [],
          TimeBufferUpdated: [], PaymentTokenUpdated: [], TreasuryUpdated: [], FactoryPaused: [], FactoryUnpaused: [], UpgradeApproved: [],
          ImplementationRevoked: [], ImplementationRegistered: [], CurrentImplementationsUpdated: [], PropertyAdded: [],
          PropertiesReset: [], ProjectURIUpdated: [], DescriptionUpdated: [], RendererBaseUpdated: [], ContractImageUpdated: []
        };
        var names = topicNames[eventName] || topicNames[eventName.charAt(0).toUpperCase() + eventName.slice(1).replace(/_([a-z])/g, function (_, c) { return c.toUpperCase(); })] || [];
        var topics = {};
        names.forEach(function (name, index) { if (topicValues[index] !== undefined) topics[name] = topicValues[index]; });
        var args = native(rawData);
        if (!args || typeof args !== 'object' || Array.isArray(args)) args = { value: args };

        function stringify(value) { return value === null || value === undefined ? null : String(value); }
        var result = {
          event_id: data.event_id || data.id || null, deployment_id: data.deployment_id || null, contract_id: data.contract_id || null,
          contract_role: data.contract_role === 'manager' ? 'manager' : roleForEvent(eventName), event_name: eventName,
          topic_0: stringify(topicValues[0]), topic_1: stringify(topicValues[1]), topic_2: stringify(topicValues[2]), topic_3: stringify(topicValues[3]),
          topics: JSON.stringify(topics), args: JSON.stringify(args), payload: JSON.stringify(Object.assign({}, topics, args)),
          transaction_hash: data.transaction_hash || null, transaction_successful: data.transaction_successful ?? null,
          ledger_sequence: data.ledger_sequence ?? null, ledger_hash: data.ledger_hash || null, ledger_closed_at: data.ledger_closed_at || null,
          transaction_index: data.transaction_index ?? null, operation_index: data.operation_index ?? null, event_index: data.event_index ?? null,
          operation_type: data.operation_type || null, _gs_op: data._gs_op || null, decoder_version: 'v2'
        };
        // These aliases are intentionally not declared in the Goldsky schema. They keep
        // local transform fixtures useful while consumers migrate to topics/args.
        Object.keys(topics).forEach(function (key) { result[key] = topics[key]; });
        Object.keys(args).forEach(function (key) {
          if (key !== 'args' && key !== 'topics' && key !== 'payload') result[key] = args[key];
        });
        return result;

        function roleForEvent(name) {
          var canonical = name.charAt(0).toUpperCase() + name.slice(1).replace(/_([a-z])/g, function (_, c) { return c.toUpperCase(); });
          if (/^(Dao|Factory|Upgrade|Implementation|CurrentImplementations)/.test(canonical)) return 'manager';
          if (/^(Proposal|Vote|Governor|Quorum|Voting|Queue|Veto)/.test(canonical)) return 'governor';
          if (/^(Auction|Bid|ReservePrice|MinBid|TimeBuffer|DurationUpdated|PaymentToken)/.test(canonical)) return 'auction';
          if (/^(Execute|Treasury|GovernorChanged)/.test(canonical)) return 'treasury';
          if (/^(Metadata|Property|Properties|Seed|ProjectURI|Description|RendererBase|ContractImage)/.test(canonical)) return 'metadata';
          if (/^(Transfer|Mint|BatchMint|Delegate|Approve|MintAuthority|Token|Burn)/.test(canonical)) return 'token';
          return 'unknown';
        }
      }

  activity_feed:
    type: script
    from: decoded_events
    language: typescript
    primary_key: activity_id
    schema:
      activity_id: string
      deployment_id: string
      contract_id: string
      contract_role: string
      event_name: string
      topics: string
      args: string
      kind: string
      title: string
      summary: string
      visibility: string
      proposal_id: string
      token_id: string
      amount: string
      actor: string
      addresses: string
      ledger_sequence: int64
      transaction_index: int64
      operation_index: int64
      event_index: int64
      ledger_closed_at: string
      transaction_hash: string
    script: |
      function invoke(data) {
        function parsePayload(value) {
          if (typeof value === 'string') {
            var trimmed = value.trim();
            if ((trimmed.startsWith('{') && trimmed.endsWith('}')) || (trimmed.startsWith('[') && trimmed.endsWith(']'))) {
              try {
                return parsePayload(JSON.parse(trimmed));
              } catch {
                return null;
              }
            }
          }

          if (value && typeof value === 'object') {
            return value;
          }

          return null;
        }

        function pick(row, keys) {
          var payload = parsePayload(row.args) || parsePayload(row.topics) || parsePayload(row.payload) || parsePayload(row.data);
          for (var i = 0; i < keys.length; i += 1) {
            var key = keys[i];
            if (row[key] !== undefined && row[key] !== null && row[key] !== '') {
              return row[key];
            }
            if (payload && payload[key] !== undefined && payload[key] !== null && payload[key] !== '') {
              return payload[key];
            }
          }
          return undefined;
        }

        function unique(values) {
          var seen = {};
          var out = [];
          for (var i = 0; i < values.length; i += 1) {
            var value = values[i];
            if (!value || seen[value]) {
              continue;
            }
            seen[value] = true;
            out.push(value);
          }
          return out;
        }

        var eventName = data.event_name || data.event_type;
        if (!eventName) {
          return null;
        }

        function normalizeEventName(name) {
          var str = String(name);
          return str.charAt(0).toUpperCase() + str.slice(1).replace(/_([a-z])/g, function (match, letter) {
            return letter.toUpperCase();
          });
        }

        var normalizedEventName = normalizeEventName(eventName);

        var userFacing = {
          TokenInitialized: true, Mint: true, MintWithMinter: true, BatchMint: true,
          Transfer: true, DelegateChanged: true, DelegateVotesChanged: true,
          ProposalCreated: true, ProposalQueued: true, VoteCast: true,
          ProposalCancelled: true, ProposalCanceled: true, ProposalExecuted: true,
          ProposalExpired: true, AuctionCreated: true, BidPlaced: true,
          AuctionSettled: true, BidRefunded: true, AuctionCancelled: true,
          DaoCreated: true, DaoRegistered: true, DaoFinalized: true
        };

        var kindMap = {
          TokenInitialized: 'token.initialized',
          Mint: 'token.mint',
          MintWithMinter: 'token.mint',
          BatchMint: 'token.batch_mint',
          MintAuthorityChanged: 'token.mint_authority_changed',
          Approve: 'token.approve',
          Transfer: 'token.transfer',
          DelegateChanged: 'token.delegate_changed',
          DelegateVotesChanged: 'token.delegate_votes_changed',
          GovernorInitialized: 'governance.initialized',
          ProposalCreated: 'governance.proposal_created',
          ProposalQueued: 'governance.proposal_queued',
          VoteCast: 'governance.vote_cast',
          ProposalCancelled: 'governance.proposal_cancelled',
          ProposalExecuted: 'governance.proposal_executed',
          TreasuryChanged: 'governance.treasury_changed',
          TokenContractChanged: 'governance.token_contract_changed',
          QueueDelayChanged: 'governance.queue_delay_changed',
          VotingDelayChanged: 'governance.voting_delay_changed',
          VotingPeriodChanged: 'governance.voting_period_changed',
          ProposalThresholdChanged: 'governance.proposal_threshold_changed',
          QuorumBpsChanged: 'governance.quorum_bps_changed',
          GovernorAuthorityChanged: 'governance.authority_changed',
          TreasuryInitialized: 'treasury.initialized',
          GovernorChanged: 'treasury.governor_changed',
          Execute: 'treasury.execute',
          AuctionInitialized: 'auction.initialized',
          AuctionCreated: 'auction.created',
          BidPlaced: 'auction.bid_placed',
          AuctionSettled: 'auction.settled',
          DurationUpdated: 'auction.duration_updated',
          ReservePriceUpdated: 'auction.reserve_price_updated',
          MinBidIncrementUpdated: 'auction.min_bid_increment_updated',
          TimeBufferUpdated: 'auction.time_buffer_updated',
          PaymentTokenUpdated: 'auction.payment_token_updated',
          TreasuryUpdated: 'auction.treasury_updated',
          BidRefunded: 'auction.bid_refunded',
          AuctionCancelled: 'auction.cancelled',
          DaoCreated: 'manager.dao_created',
          DaoRegistered: 'manager.dao_registered',
          DaoFinalized: 'manager.dao_finalized',
          FactoryPaused: 'manager.factory_paused',
          FactoryUnpaused: 'manager.factory_unpaused',
          UpgradeApproved: 'manager.upgrade_approved',
          ImplementationRevoked: 'manager.implementation_revoked',
          ImplementationRegistered: 'manager.implementation_registered',
          CurrentImplementationsUpdated: 'manager.implementations_updated',
          MetadataInitialized: 'metadata.initialized',
          PropertyAdded: 'metadata.property_added',
          SeedGenerated: 'metadata.seed_generated',
          PropertiesReset: 'metadata.properties_reset',
          ProjectURIUpdated: 'metadata.project_uri_updated',
          DescriptionUpdated: 'metadata.description_updated',
          RendererBaseUpdated: 'metadata.renderer_base_updated',
          ContractImageUpdated: 'metadata.contract_image_updated'
        };

        var titleMap = {
          TokenInitialized: 'Token initialized',
          Mint: 'Token minted',
          MintWithMinter: 'Token minted',
          BatchMint: 'Batch mint completed',
          MintAuthorityChanged: 'Mint authority changed',
          Approve: 'Token approval granted',
          Transfer: 'Token transferred',
          DelegateChanged: 'Delegation changed',
          DelegateVotesChanged: 'Voting power changed',
          GovernorInitialized: 'Governor initialized',
          ProposalCreated: 'Proposal created',
          ProposalQueued: 'Proposal queued',
          VoteCast: 'Vote cast',
          ProposalCancelled: 'Proposal cancelled',
          ProposalExecuted: 'Proposal executed',
          TreasuryChanged: 'Treasury changed',
          TokenContractChanged: 'Token contract changed',
          QueueDelayChanged: 'Queue delay updated',
          VotingDelayChanged: 'Voting delay updated',
          VotingPeriodChanged: 'Voting period updated',
          ProposalThresholdChanged: 'Proposal threshold updated',
          QuorumBpsChanged: 'Quorum updated',
          GovernorAuthorityChanged: 'Governor authority changed',
          TreasuryInitialized: 'Treasury initialized',
          GovernorChanged: 'Governor changed',
          Execute: 'Treasury executed call',
          AuctionInitialized: 'Auction initialized',
          AuctionCreated: 'Auction created',
          BidPlaced: 'Bid placed',
          AuctionSettled: 'Auction settled',
          DurationUpdated: 'Auction duration updated',
          ReservePriceUpdated: 'Reserve price updated',
          MinBidIncrementUpdated: 'Minimum bid increment updated',
          TimeBufferUpdated: 'Time buffer updated',
          PaymentTokenUpdated: 'Payment token updated',
          TreasuryUpdated: 'Treasury updated',
          BidRefunded: 'Bid refunded',
          AuctionCancelled: 'Auction cancelled',
          DaoCreated: 'DAO created',
          DaoRegistered: 'DAO registered',
          DaoFinalized: 'DAO finalized',
          FactoryPaused: 'Factory paused',
          FactoryUnpaused: 'Factory unpaused',
          UpgradeApproved: 'Upgrade approved',
          ImplementationRevoked: 'Implementation revoked',
          ImplementationRegistered: 'Implementation registered',
          CurrentImplementationsUpdated: 'Implementations updated',
          MetadataInitialized: 'Metadata initialized',
          PropertyAdded: 'Property added',
          SeedGenerated: 'Seed generated',
          PropertiesReset: 'Properties reset',
          ProjectURIUpdated: 'Project URI updated',
          DescriptionUpdated: 'Description updated',
          RendererBaseUpdated: 'Renderer base updated',
          ContractImageUpdated: 'Contract image updated'
        };

        var addresses = unique([
          pick(data, ['actor']),
          pick(data, ['proposer']),
          pick(data, ['bidder']),
          pick(data, ['minter']),
          pick(data, ['owner']),
          pick(data, ['changed_by']),
          pick(data, ['cancelled_by']),
          pick(data, ['executor']),
          pick(data, ['governor']),
          pick(data, ['treasury']),
          pick(data, ['new_treasury']),
          pick(data, ['new_governor']),
          pick(data, ['token_contract']),
          pick(data, ['token_contract_id']),
          pick(data, ['contract_id']),
          pick(data, ['creator']),
          pick(data, ['token_address'])
        ]);

        var summary;
        if (normalizedEventName === 'ProposalQueued') {
          summary = 'Proposal ' + (pick(data, ['proposal_id']) || '') + ' queued';
        } else if (normalizedEventName === 'ProposalCreated') {
          summary = 'Proposal created';
        } else if (normalizedEventName === 'VoteCast') {
          summary = 'Vote cast on proposal';
        } else if (normalizedEventName === 'BidPlaced') {
          summary = 'Bid of ' + (pick(data, ['amount']) || 'unknown') + ' placed on token ' + (pick(data, ['token_id']) || 'unknown');
        } else if (normalizedEventName === 'AuctionSettled') {
          summary = 'Auction settled for token ' + (pick(data, ['token_id']) || 'unknown');
        } else if (normalizedEventName === 'AuctionCreated') {
          summary = 'Auction created for token ' + (pick(data, ['token_id']) || 'unknown');
        } else if (normalizedEventName === 'Execute') {
          summary = 'Executed ' + (pick(data, ['function']) || 'call') + ' on ' + (pick(data, ['target']) || 'target');
        } else if (normalizedEventName === 'Mint' || normalizedEventName === 'MintWithMinter') {
          summary = 'Minted token ' + (pick(data, ['token_id']) || '') + ' to ' + (pick(data, ['to', 'owner']) || 'recipient');
        } else if (normalizedEventName === 'BatchMint') {
          summary = 'Minted ' + (pick(data, ['amount']) || 'batch') + ' tokens';
        } else if (normalizedEventName === 'DelegateChanged') {
          summary = 'Delegation changed';
        } else if (normalizedEventName === 'DaoCreated') {
          summary = 'DAO created by ' + (pick(data, ['creator']) || 'unknown');
        } else if (normalizedEventName === 'DaoRegistered') {
          summary = 'DAO registered for token ' + (pick(data, ['token_address']) || 'unknown');
        } else if (normalizedEventName === 'DaoFinalized') {
          summary = 'DAO finalized for token ' + (pick(data, ['token_address']) || 'unknown');
        } else if (normalizedEventName === 'ImplementationRegistered') {
          summary = 'Implementation "' + (pick(data, ['name']) || 'unknown') + '" registered';
        } else if (normalizedEventName === 'SeedGenerated') {
          summary = 'Seed generated for token ' + (pick(data, ['token_id']) || 'unknown');
        } else if (normalizedEventName === 'PropertyAdded') {
          summary = 'Property "' + (pick(data, ['name']) || 'unknown') + '" added';
        } else if (titleMap[normalizedEventName]) {
          summary = titleMap[normalizedEventName];
        } else {
          summary = String(eventName).replace(/_/g, ' ');
        }

        return {
          activity_id: data.event_id || data.id,
          deployment_id: data.deployment_id,
          contract_id: data.contract_id,
          contract_role: data.contract_role,
          kind: kindMap[normalizedEventName] || ('contract.' + String(eventName).toLowerCase()),
          title: titleMap[normalizedEventName] || normalizedEventName,
          summary: summary,
          event_name: eventName,
          topics: typeof data.topics === 'string' ? data.topics : JSON.stringify(data.topics || {}),
          args: typeof data.args === 'string' ? data.args : JSON.stringify(data.args || {}),
          visibility: userFacing[normalizedEventName] ? (normalizedEventName.indexOf('Proposal') === 0 || normalizedEventName === 'VoteCast' ? 'governance' : 'public') : (kindMap[normalizedEventName] ? 'admin' : 'system'),
          proposal_id: pick(data, ['proposal_id']) || null,
          token_id: pick(data, ['token_id']) || null,
          amount: pick(data, ['amount', 'weight']) || null,
          actor: pick(data, ['actor', 'proposer', 'voter', 'bidder', 'minter', 'owner', 'changed_by', 'cancelled_by', 'executor', 'governor', 'treasury', 'new_treasury', 'new_governor', 'delegator', 'delegate', 'creator']) || null,
          addresses: JSON.stringify(addresses),
          ledger_sequence: data.ledger_sequence,
          transaction_index: data.transaction_index,
          operation_index: data.operation_index,
          event_index: data.event_index,
          ledger_closed_at: data.ledger_closed_at || null,
          transaction_hash: data.transaction_hash
        };
      }

  manager_daos:
    type: sql
    from: decoded_events
    primary_key: event_id
    sql: |
      SELECT
        e.event_id,
        e.deployment_id,
        e.contract_id,
        e.contract_role,
        e.event_name,
        e.topic_0,
        e.topic_1,
        e.topic_2,
        e.topic_3,
        e.topics,
        e.args,
        e.transaction_hash,
        e.transaction_successful,
        e.ledger_sequence,
        e.ledger_hash,
        e.ledger_closed_at,
        e.transaction_index,
        e.operation_index,
        e.event_index,
        e.operation_type,
        e._gs_op,
        e.decoder_version,
        -- Extract manager.daos fields from DaoCreated/DaoRegistered events
        e.topic_0 AS dao_id,
        e.topic_0 AS token_address,
        e.topic_1 AS creator,
        e.contract_id AS manager_contract,
        CASE
          WHEN e.args::jsonb @> '{"modules":{}}'
          THEN (e.args::jsonb -> 'modules' ->> 'token')::text
          ELSE NULL
        END AS token_contract,
        CASE
          WHEN e.args::jsonb @> '{"modules":{}}'
          THEN (e.args::jsonb -> 'modules' ->> 'governor')::text
          ELSE NULL
        END AS governor_contract,
        CASE
          WHEN e.args::jsonb @> '{"modules":{}}'
          THEN (e.args::jsonb -> 'modules' ->> 'auction')::text
          ELSE NULL
        END AS auction_contract,
        CASE
          WHEN e.args::jsonb @> '{"modules":{}}'
          THEN (e.args::jsonb -> 'modules' ->> 'treasury')::text
          ELSE NULL
        END AS treasury_contract,
        CASE
          WHEN e.args::jsonb @> '{"modules":{}}'
          THEN (e.args::jsonb -> 'modules' ->> 'metadata')::text
          ELSE NULL
        END AS metadata_contract,
        -- Token metadata fields are not emitted in DaoCreated event
        -- These can be populated by querying the deployed token contract separately
        NULL::varchar(255) AS token_name,
        NULL::varchar(16) AS token_symbol,
        NULL::text AS token_description,
        NULL::text AS token_uri,
        NULL::varchar(56) AS admin_address,
        'pending'::text AS status,
        e.ledger_sequence AS created_ledger,
        to_timestamp(
          CASE
            WHEN e.ledger_closed_at IS NOT NULL AND e.ledger_closed_at != ''
            THEN NULLIF(e.ledger_closed_at, '')::numeric / 1000
            ELSE NULL
          END
        ) AS created_at,
        e.transaction_hash AS created_tx_hash,
        NULL::bigint AS finalized_ledger,
        NULL::timestamptz AS finalized_at,
        NULL::text AS finalized_tx_hash
      FROM decoded_events e
      WHERE e.contract_role = 'manager'
      AND LOWER(e.event_name) IN ('dao_created', 'daocreated', 'dao_registered', 'daoregistered')

  manager_daos_finalized:
    type: sql
    from: decoded_events
    primary_key: event_id
    sql: |
      SELECT
        e.event_id,
        e.deployment_id,
        e.contract_id,
        e.contract_role,
        e.event_name,
        e.topic_0,
        e.topic_1,
        e.topic_2,
        e.topic_3,
        e.topics,
        e.args,
        e.transaction_hash,
        e.transaction_successful,
        e.ledger_sequence,
        e.ledger_hash,
        e.ledger_closed_at,
        e.transaction_index,
        e.operation_index,
        e.event_index,
        e.operation_type,
        e._gs_op,
        e.decoder_version,
        d.dao_id,
        d.token_address,
        d.creator,
        d.manager_contract,
        d.token_contract,
        d.governor_contract,
        d.auction_contract,
        d.treasury_contract,
        d.metadata_contract,
        d.token_name,
        d.token_symbol,
        d.token_description,
        d.token_uri,
        d.admin_address,
        'operational'::text AS status,
        d.created_ledger,
        d.created_at,
        d.created_tx_hash,
        e.ledger_sequence AS finalized_ledger,
        to_timestamp(
          CASE
            WHEN e.ledger_closed_at IS NOT NULL AND e.ledger_closed_at != ''
            THEN NULLIF(e.ledger_closed_at, '')::numeric / 1000
            ELSE NULL
          END
        ) AS finalized_at,
        e.transaction_hash AS finalized_tx_hash
      FROM decoded_events e
      JOIN manager_daos d
        ON d.deployment_id = e.deployment_id
       AND d.dao_id = e.topic_0
      WHERE e.contract_role = 'manager'
      AND LOWER(e.event_name) IN ('dao_finalized', 'daofinalized')

  manager_daos_enriched:
    type: sql
    from: decoded_events
    primary_key: event_id
    sql: |
      SELECT
        e.event_id,
        e.deployment_id,
        -- Extract manager.daos enrichment from TokenInitialized events
        CASE
          WHEN e.args::jsonb @> '{"owner":""}'
          THEN (e.args::jsonb ->> 'owner')::text
          ELSE NULL
        END AS dao_id,
        e.contract_id AS token_contract,
        e.args ->> 'name' AS token_name,
        e.args ->> 'symbol' AS token_symbol,
        e.args ->> 'uri' AS token_uri,
        NULL::text AS token_description,
        NULL::varchar(56) AS admin_address
      FROM decoded_events e
      WHERE e.contract_role = 'token'
      AND LOWER(e.event_name) IN ('tokeninitialized', 'token_initialized')
      AND e.args IS NOT NULL

sinks:
  raw_events_output:
    type: postgres
    from: raw_events
    schema: chain
    table: raw_events
    secret_name: STELLAR_BUILDER_POSTGRES
    primary_key: event_id

  decoded_events_output:
    type: postgres
    from: decoded_events
    schema: chain
    table: decoded_events
    secret_name: STELLAR_BUILDER_POSTGRES
    primary_key: event_id

  activity_feed_output:
    type: postgres
    from: activity_feed
    schema: app
    table: activity_feed_events
    secret_name: STELLAR_BUILDER_POSTGRES
    primary_key: activity_id

  manager_daos_output:
    type: postgres
    from: manager_daos
    schema: manager
    table: daos
    secret_name: STELLAR_BUILDER_POSTGRES
    primary_key:
      - deployment_id
      - dao_id
    upsert: true
    upsert_keys:
      - deployment_id
      - dao_id

  manager_daos_finalized_output:
    type: postgres
    from: manager_daos_finalized
    schema: manager
    table: daos
    secret_name: STELLAR_BUILDER_POSTGRES
    primary_key:
      - deployment_id
      - dao_id
    upsert: true
    upsert_keys:
      - deployment_id
      - dao_id

  manager_daos_enriched_output:
    type: postgres
    from: manager_daos_enriched
    schema: manager
    table: daos
    secret_name: STELLAR_BUILDER_POSTGRES
    primary_key:
      - deployment_id
      - dao_id
    upsert: true
    upsert_keys:
      - deployment_id
      - dao_id
