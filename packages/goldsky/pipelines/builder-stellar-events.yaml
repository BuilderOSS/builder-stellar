name: builder-stellar-events
description: Index Manager CD5ARHFOXUWDVD6XG3ZFYQPQDUTDCFMWRG5GTKFTFGHDYWQJRV4G46BF on testnet with Goldsky Turbo
resource_size: s
use_dedicated_ip: false
job: false
sources:
  stellar_events:
    type: dataset
    dataset_name: stellar_testnet.events
    version: 1.2.0
    start_at: 4809830

transforms:
  dao_events:
    type: sql
    primary_key: event_id
    sql: |
      SELECT
        id AS event_id,
        'manager:CD5ARHFOXUWDVD6XG3ZFYQPQDUTDCFMWRG5GTKFTFGHDYWQJRV4G46BF' AS deployment_id,
        contract_id,
        CASE WHEN contract_id = 'CD5ARHFOXUWDVD6XG3ZFYQPQDUTDCFMWRG5GTKFTFGHDYWQJRV4G46BF' THEN 'manager' ELSE 'unknown' END AS contract_role,
        type,
        topics,
        data,
        in_successful_contract_call,
        transaction_hash,
        transaction_account,
        transaction_account_muxed,
        transaction_fee_account,
        transaction_fee_account_muxed,
        transaction_successful,
        transaction_index,
        operation_body,
        operation_result_code,
        operation_type,
        ledger_sequence,
        ledger_hash,
        ledger_closed_at,
        _gs_op
      FROM stellar_events
       WHERE ledger_sequence >= 4809830

  raw_events:
    type: script
    from: dao_events
    language: typescript
    primary_key: event_id
    schema:
      event_id: string
      deployment_id: string
      contract_id: string
      contract_role: string
      topics: string
      data: string
      transaction_hash: string
      transaction_successful: boolean
      ledger_sequence: int64
      ledger_hash: string
      ledger_closed_at: string
      transaction_index: int64
      operation_index: int64
      event_index: int64
      operation_type: string
      _gs_op: string
    script: |
      function invoke(data) {
        if (!data) return null;

        function stringify(value) {
          if (value === undefined || value === null) {
            return '{}';  // Default to empty JSON object string
          }

          if (typeof value === 'string') {
            var trimmed = value.trim();
            if ((trimmed.startsWith('{') && trimmed.endsWith('}')) || (trimmed.startsWith('[') && trimmed.endsWith(']'))) {
              return value;
            }
          }

          try {
            return JSON.stringify(value);
          } catch {
            return String(value);
          }
        }

        // Type-safe helpers for Arrow table serialization
        // CRITICAL: For Arrow serialization, all rows must have same type in each column
        // Never mix null with values for string columns - use empty string for missing values
        function toStringOrEmpty(value) {
          if (value === null || value === undefined || value === '') return '';
          return String(value);
        }
        function toNumber(value) {
          if (value === null || value === undefined) return null;
          var n = Number(value);
          return isFinite(n) ? n : null;
        }
        function toBoolean(value) {
          if (value === null || value === undefined) return null;
          return Boolean(value);
        }

        return {
          event_id: toStringOrEmpty(data.event_id || data.id),
          deployment_id: toStringOrEmpty(data.deployment_id),
          contract_id: toStringOrEmpty(data.contract_id),
          contract_role: toStringOrEmpty(data.contract_role) || 'unknown',
          topics: stringify(data.topics),
          data: stringify(data.data ?? data.payload ?? data),
          transaction_hash: toStringOrEmpty(data.transaction_hash),
          transaction_successful: toBoolean(data.transaction_successful),
          ledger_sequence: toNumber(data.ledger_sequence),
          ledger_hash: toStringOrEmpty(data.ledger_hash),
          ledger_closed_at: toStringOrEmpty(data.ledger_closed_at),
          transaction_index: toNumber(data.transaction_index),
          operation_index: toNumber(data.operation_index),
          event_index: toNumber(data.event_index),
          operation_type: toStringOrEmpty(data.operation_type),
          _gs_op: toStringOrEmpty(data._gs_op)
        };
      }

  decoded_events:
    type: script
    from: raw_events
    language: typescript
    primary_key: event_id
    schema:
      event_id: string
      deployment_id: string
      contract_id: string
      contract_role: string
      event_name: string
      topic_0: string
      topic_1: string
      topic_2: string
      topic_3: string
      topics: string
      args: string
      transaction_hash: string
      transaction_successful: boolean
      ledger_sequence: int64
      ledger_hash: string
      ledger_closed_at: string
      transaction_index: int64
      operation_index: int64
      event_index: int64
      operation_type: string
      _gs_op: string
      decoder_version: string
    script: |
      function invoke(data) {
        try {
          if (!data) return null;

          function toCanonical(name) {
            return name.charAt(0).toUpperCase() + name.slice(1).replace(/_([a-z])/g, function (_, c) { return c.toUpperCase(); });
          }

          function native(value) {
            if (value === null || value === undefined || value === 'void') return null;
            if (typeof value !== 'object') return value;
            if (value.symbol !== undefined) return String(value.symbol);
            if (value.address !== undefined) return String(value.address);
            var scalar = ['u32', 'i32', 'u64', 'i64', 'u128', 'i128', 'u256', 'i256', 'bytes', 'string', 'bool'];
            for (var i = 0; i < scalar.length; i += 1) {
              if (value[scalar[i]] !== undefined) return scalar[i].match(/^[ui](64|128|256)$/) ? String(value[scalar[i]]) : value[scalar[i]];
            }
            if (Array.isArray(value.vec)) return value.vec.map(native);
            if (Array.isArray(value.map)) {
              var out = {};
              value.map.forEach(function (entry) { if (entry && entry.key !== undefined) out[String(native(entry.key))] = native(entry.val); });
              return out;
            }
            return value;
          }

          function json(value) {
            if (typeof value !== 'string') return value;
            try { return JSON.parse(value); } catch (e) {
              console.error('JSON parse error:', e.message, 'value:', String(value).substring(0, 100));
              return null;
            }
          }

          var rawTopics = json(data.topics);
          var rawData = json(data.data);
          if (!Array.isArray(rawTopics) || rawTopics.length === 0) {
            console.error('Invalid topics for event:', data.event_id);
            return null;
          }

        var values = rawTopics.map(native);
        var eventName = String(values[0]);
        var topicValues = values.slice(1);
        var topicNames = {
          ProposalCreated: ['proposal_id', 'proposer'], VoteCast: ['voter', 'proposal_id'],
          ProposalQueued: ['proposal_id'], ProposalCancelled: ['proposal_id'], ProposalCanceled: ['proposal_id'], ProposalExecuted: ['proposal_id'],
          MintWithMinter: ['minter', 'to'], Mint: ['to'], BatchMint: ['minter', 'to'], Transfer: ['from', 'to'], Approve: ['owner', 'spender'],
          DelegateChanged: ['delegator'], DelegateVotesChanged: ['delegate'], AuctionCreated: ['token_id'], BidPlaced: ['token_id', 'bidder'],
          AuctionSettled: ['token_id'], BidRefunded: ['token_id', 'bidder'], AuctionCancelled: ['token_id'], Execute: ['governor', 'target'],
          TokenInitialized: ['owner'], MintAuthorityChanged: ['authority'], GovernorInitialized: ['owner'], TreasuryChanged: ['old_treasury', 'new_treasury'],
          TokenContractChanged: ['old_token_contract', 'new_token_contract'], GovernorAuthorityChanged: ['authority'], AuctionInitialized: ['owner'],
          TreasuryInitialized: ['owner'], GovernorChanged: ['old_governor', 'new_governor'], DaoCreated: ['token_address', 'creator'], DaoRegistered: ['token_address', 'creator'], DaoFinalized: ['token_address'],
           SeedGenerated: ['token_id'], MetadataInitialized: ['token'], ProposalExpired: [],
          ProposalThresholdChanged: ['caller'], QuorumBpsChanged: ['caller'], QueueDelayChanged: ['caller'], VotingDelayChanged: ['caller'], VotingPeriodChanged: ['caller'], DurationUpdated: [], ReservePriceUpdated: [], MinBidIncrementUpdated: [],
          TimeBufferUpdated: [], PaymentTokenUpdated: [], TreasuryUpdated: [], FactoryPaused: [], FactoryUnpaused: [], UpgradeApproved: [],
          ImplementationRevoked: [], ImplementationRegistered: [], CurrentImplementationsUpdated: [], PropertyAdded: [],
          PropertiesReset: [], ProjectURIUpdated: [], DescriptionUpdated: [], RendererBaseUpdated: [], ContractImageUpdated: []
        };
        var names = topicNames[eventName] || topicNames[toCanonical(eventName)] || [];
        var topics = {};
        names.forEach(function (name, index) { if (topicValues[index] !== undefined) topics[name] = topicValues[index]; });
        var args = native(rawData);
        if (!args || typeof args !== 'object' || Array.isArray(args)) args = { value: args };

        // Type-safe helpers to ensure consistent Arrow table types
        // CRITICAL: For Arrow serialization, all rows must have same type in each column
        // Never mix null with values - use empty string for missing strings, null for missing numbers
        function toStringOrEmpty(value) {
          if (value === null || value === undefined) return '';
          return String(value);
        }
        function toNumber(value) {
          if (value === null || value === undefined) return null;
          var n = Number(value);
          return isFinite(n) ? n : null;
        }
        function toBoolean(value) {
          if (value === null || value === undefined) return null;
          return Boolean(value);
        }

        var result = {
          event_id: toStringOrEmpty(data.event_id || data.id),
          deployment_id: toStringOrEmpty(data.deployment_id),
          contract_id: toStringOrEmpty(data.contract_id),
          contract_role: String(data.contract_role === 'manager' ? 'manager' : roleForEvent(eventName)),
          event_name: toStringOrEmpty(eventName),
          topic_0: toStringOrEmpty(topicValues[0]),
          topic_1: toStringOrEmpty(topicValues[1]),
          topic_2: toStringOrEmpty(topicValues[2]),
          topic_3: toStringOrEmpty(topicValues[3]),
          topics: JSON.stringify(topics),
          args: JSON.stringify(args),
          payload: JSON.stringify(Object.assign({}, topics, args)),
          transaction_hash: toStringOrEmpty(data.transaction_hash),
          transaction_successful: toBoolean(data.transaction_successful),
          ledger_sequence: toNumber(data.ledger_sequence),
          ledger_hash: toStringOrEmpty(data.ledger_hash),
          ledger_closed_at: toStringOrEmpty(data.ledger_closed_at),
          transaction_index: toNumber(data.transaction_index),
          operation_index: toNumber(data.operation_index),
          event_index: toNumber(data.event_index),
          operation_type: toStringOrEmpty(data.operation_type),
          _gs_op: toStringOrEmpty(data._gs_op),
          decoder_version: 'v2'
        };
        // These aliases are intentionally not declared in the Goldsky schema. They keep
        // local transform fixtures useful while consumers migrate to topics/args.
        // Note: Schema fields (args, topics, payload) must stay as JSON strings for JSONB columns.
        // Only convert non-schema field aliases to strings for type safety.
        Object.keys(topics).forEach(function (key) { result[key] = toStringOrEmpty(topics[key]); });
        Object.keys(args).forEach(function (key) {
          if (key !== 'args' && key !== 'topics' && key !== 'payload') result[key] = toStringOrEmpty(args[key]);
        });
          return result;

          function roleForEvent(name) {
            var canonical = toCanonical(name);
            if (/^(Dao|Factory|Upgrade|Implementation|CurrentImplementations)/.test(canonical)) return 'manager';
            if (/^(Proposal|Vote|Governor|Quorum|Voting|Queue|Veto)/.test(canonical)) return 'governor';
            if (/^(Auction|Bid|ReservePrice|MinBid|TimeBuffer|DurationUpdated|PaymentToken)/.test(canonical)) return 'auction';
            if (/^(Execute|Treasury|GovernorChanged)/.test(canonical)) return 'treasury';
            if (/^(Metadata|Property|Properties|Seed|ProjectURI|Description|RendererBase|ContractImage)/.test(canonical)) return 'metadata';
            if (/^(Transfer|Mint|BatchMint|Delegate|Approve|MintAuthority|Token|Burn)/.test(canonical)) return 'token';
            return 'unknown';
          }
        } catch (e) {
          console.error('Decoder error:', e.message, 'event_id:', data?.event_id);
          return null;
        }
      }

  activity_feed:
    type: script
    from: decoded_events
    language: typescript
    primary_key: activity_id
    schema:
      activity_id: string
      deployment_id: string
      contract_id: string
      contract_role: string
      event_name: string
      topics: string
      args: string
      kind: string
      title: string
      summary: string
      visibility: string
      proposal_id: string
      token_id: string
      amount: string
      actor: string
      addresses: string
      ledger_sequence: int64
      transaction_index: int64
      operation_index: int64
      event_index: int64
      ledger_closed_at: string
      transaction_hash: string
    script: |
      function invoke(data) {
        try {
          if (!data) return null;

          // Normalize all incoming fields to ensure consistent types across all rows
          // This is critical for Arrow table serialization - all rows must have identical types
          function ensureString(val, def) {
            return (typeof val === 'string' && val) ? val : def;
          }
          function ensureNumber(val, def) {
            var n = Number(val);
            return isFinite(n) ? n : def;
          }

          var topics = ensureString(data.topics, '{}');
          var args = ensureString(data.args, '{}');
          var ledger_sequence = ensureNumber(data.ledger_sequence, 0);
          var transaction_index = ensureNumber(data.transaction_index, 0);
          var operation_index = ensureNumber(data.operation_index, 0);
          var event_index = ensureNumber(data.event_index, 0);

          function parsePayload(value) {
            try {
              if (typeof value === 'string') {
                var trimmed = value.trim();
                if ((trimmed.startsWith('{') && trimmed.endsWith('}')) || (trimmed.startsWith('[') && trimmed.endsWith(']'))) {
                  return parsePayload(JSON.parse(trimmed));
                }
              }

              if (value && typeof value === 'object') {
                return value;
              }

              return null;
            } catch (e) {
              console.error('Payload parse error:', e.message, 'value:', String(value).substring(0, 100));
              return null;
            }
          }

        function pick(row, keys) {
          var payload = parsePayload(args) || parsePayload(topics) || parsePayload(row.payload) || parsePayload(row.data);
          for (var i = 0; i < keys.length; i += 1) {
            var key = keys[i];
            if (row[key] !== undefined && row[key] !== null && row[key] !== '') {
              return String(row[key]);
            }
            if (payload && payload[key] !== undefined && payload[key] !== null && payload[key] !== '') {
              return String(payload[key]);
            }
          }
          return '';
        }

        function unique(values) {
          var seen = {};
          var out = [];
          for (var i = 0; i < values.length; i += 1) {
            var value = values[i];
            if (!value || seen[value]) {
              continue;
            }
            seen[value] = true;
            out.push(value);
          }
          return out;
        }

        var eventName = data.event_name || data.event_type;
        if (!eventName) {
          return null;
        }

        function normalizeEventName(name) {
          var str = String(name);
          return str.charAt(0).toUpperCase() + str.slice(1).replace(/_([a-z])/g, function (match, letter) {
            return letter.toUpperCase();
          });
        }

        var normalizedEventName = normalizeEventName(eventName);

        var userFacing = {
          TokenInitialized: true, Mint: true, MintWithMinter: true, BatchMint: true,
          Transfer: true, DelegateChanged: true, DelegateVotesChanged: true,
          ProposalCreated: true, ProposalQueued: true, VoteCast: true,
          ProposalCancelled: true, ProposalCanceled: true, ProposalExecuted: true,
          AuctionCreated: true, BidPlaced: true,
          AuctionSettled: true, BidRefunded: true, AuctionCancelled: true,
          DaoCreated: true, DaoRegistered: true, DaoFinalized: true
        };

        var kindMap = {
          TokenInitialized: 'token.initialized',
          Mint: 'token.mint',
          MintWithMinter: 'token.mint',
          BatchMint: 'token.batch_mint',
          MintAuthorityChanged: 'token.mint_authority_changed',
          Approve: 'token.approve',
          Transfer: 'token.transfer',
          DelegateChanged: 'token.delegate_changed',
          DelegateVotesChanged: 'token.delegate_votes_changed',
          GovernorInitialized: 'governance.initialized',
          ProposalCreated: 'governance.proposal_created',
          ProposalQueued: 'governance.proposal_queued',
          VoteCast: 'governance.vote_cast',
          ProposalCancelled: 'governance.proposal_cancelled',
          ProposalExecuted: 'governance.proposal_executed',
          TreasuryChanged: 'governance.treasury_changed',
          TokenContractChanged: 'governance.token_contract_changed',
          QueueDelayChanged: 'governance.queue_delay_changed',
          VotingDelayChanged: 'governance.voting_delay_changed',
          VotingPeriodChanged: 'governance.voting_period_changed',
          ProposalThresholdChanged: 'governance.proposal_threshold_changed',
          QuorumBpsChanged: 'governance.quorum_bps_changed',
          GovernorAuthorityChanged: 'governance.authority_changed',
          TreasuryInitialized: 'treasury.initialized',
          GovernorChanged: 'treasury.governor_changed',
          Execute: 'treasury.execute',
          AuctionInitialized: 'auction.initialized',
          AuctionCreated: 'auction.created',
          BidPlaced: 'auction.bid_placed',
          AuctionSettled: 'auction.settled',
          DurationUpdated: 'auction.duration_updated',
          ReservePriceUpdated: 'auction.reserve_price_updated',
          MinBidIncrementUpdated: 'auction.min_bid_increment_updated',
          TimeBufferUpdated: 'auction.time_buffer_updated',
          PaymentTokenUpdated: 'auction.payment_token_updated',
          TreasuryUpdated: 'auction.treasury_updated',
          BidRefunded: 'auction.bid_refunded',
          AuctionCancelled: 'auction.cancelled',
          DaoCreated: 'manager.dao_created',
          DaoRegistered: 'manager.dao_registered',
          DaoFinalized: 'manager.dao_finalized',
          FactoryPaused: 'manager.factory_paused',
          FactoryUnpaused: 'manager.factory_unpaused',
          UpgradeApproved: 'manager.upgrade_approved',
          ImplementationRevoked: 'manager.implementation_revoked',
          ImplementationRegistered: 'manager.implementation_registered',
          CurrentImplementationsUpdated: 'manager.implementations_updated',
          MetadataInitialized: 'metadata.initialized',
          PropertyAdded: 'metadata.property_added',
          SeedGenerated: 'metadata.seed_generated',
          PropertiesReset: 'metadata.properties_reset',
          ProjectURIUpdated: 'metadata.project_uri_updated',
          DescriptionUpdated: 'metadata.description_updated',
          RendererBaseUpdated: 'metadata.renderer_base_updated',
          ContractImageUpdated: 'metadata.contract_image_updated'
        };

        var titleMap = {
          TokenInitialized: 'Token initialized',
          Mint: 'Token minted',
          MintWithMinter: 'Token minted',
          BatchMint: 'Batch mint completed',
          MintAuthorityChanged: 'Mint authority changed',
          Approve: 'Token approval granted',
          Transfer: 'Token transferred',
          DelegateChanged: 'Delegation changed',
          DelegateVotesChanged: 'Voting power changed',
          GovernorInitialized: 'Governor initialized',
          ProposalCreated: 'Proposal created',
          ProposalQueued: 'Proposal queued',
          VoteCast: 'Vote cast',
          ProposalCancelled: 'Proposal cancelled',
          ProposalExecuted: 'Proposal executed',
          TreasuryChanged: 'Treasury changed',
          TokenContractChanged: 'Token contract changed',
          QueueDelayChanged: 'Queue delay updated',
          VotingDelayChanged: 'Voting delay updated',
          VotingPeriodChanged: 'Voting period updated',
          ProposalThresholdChanged: 'Proposal threshold updated',
          QuorumBpsChanged: 'Quorum updated',
          GovernorAuthorityChanged: 'Governor authority changed',
          TreasuryInitialized: 'Treasury initialized',
          GovernorChanged: 'Governor changed',
          Execute: 'Treasury executed call',
          AuctionInitialized: 'Auction initialized',
          AuctionCreated: 'Auction created',
          BidPlaced: 'Bid placed',
          AuctionSettled: 'Auction settled',
          DurationUpdated: 'Auction duration updated',
          ReservePriceUpdated: 'Reserve price updated',
          MinBidIncrementUpdated: 'Minimum bid increment updated',
          TimeBufferUpdated: 'Time buffer updated',
          PaymentTokenUpdated: 'Payment token updated',
          TreasuryUpdated: 'Treasury updated',
          BidRefunded: 'Bid refunded',
          AuctionCancelled: 'Auction cancelled',
          DaoCreated: 'DAO created',
          DaoRegistered: 'DAO registered',
          DaoFinalized: 'DAO finalized',
          FactoryPaused: 'Factory paused',
          FactoryUnpaused: 'Factory unpaused',
          UpgradeApproved: 'Upgrade approved',
          ImplementationRevoked: 'Implementation revoked',
          ImplementationRegistered: 'Implementation registered',
          CurrentImplementationsUpdated: 'Implementations updated',
          MetadataInitialized: 'Metadata initialized',
          PropertyAdded: 'Property added',
          SeedGenerated: 'Seed generated',
          PropertiesReset: 'Properties reset',
          ProjectURIUpdated: 'Project URI updated',
          DescriptionUpdated: 'Description updated',
          RendererBaseUpdated: 'Renderer base updated',
          ContractImageUpdated: 'Contract image updated'
        };

        var addresses = unique([
          pick(data, ['actor']),
          pick(data, ['proposer']),
          pick(data, ['bidder']),
          pick(data, ['minter']),
          pick(data, ['owner']),
          pick(data, ['changed_by']),
          pick(data, ['cancelled_by']),
          pick(data, ['executor']),
          pick(data, ['governor']),
          pick(data, ['treasury']),
          pick(data, ['new_treasury']),
          pick(data, ['new_governor']),
          pick(data, ['token_contract']),
          pick(data, ['token_contract_id']),
          pick(data, ['contract_id']),
          pick(data, ['creator']),
          pick(data, ['token_address'])
        ]);

        var proposalId = pick(data, ['proposal_id']);
        var amount = pick(data, ['amount']);
        var tokenId = pick(data, ['token_id']);
        var func = pick(data, ['function']);
        var target = pick(data, ['target']);
        var owner = pick(data, ['to', 'owner']);
        var creator = pick(data, ['creator']);
        var tokenAddress = pick(data, ['token_address']);
        var name = pick(data, ['name']);

        var summaryFunctions = {
          ProposalQueued: function() { return 'Proposal ' + (proposalId || '') + ' queued'; },
          ProposalCreated: function() { return 'Proposal created'; },
          VoteCast: function() { return 'Vote cast on proposal'; },
          BidPlaced: function() { return 'Bid of ' + (amount || 'unknown') + ' placed on token ' + (tokenId || 'unknown'); },
          AuctionSettled: function() { return 'Auction settled for token ' + (tokenId || 'unknown'); },
          AuctionCreated: function() { return 'Auction created for token ' + (tokenId || 'unknown'); },
          Execute: function() { return 'Executed ' + (func || 'call') + ' on ' + (target || 'target'); },
          Mint: function() { return 'Minted token ' + (tokenId || '') + ' to ' + (owner || 'recipient'); },
          MintWithMinter: function() { return 'Minted token ' + (tokenId || '') + ' to ' + (owner || 'recipient'); },
          BatchMint: function() { return 'Minted ' + (amount || 'batch') + ' tokens'; },
          DelegateChanged: function() { return 'Delegation changed'; },
          DaoCreated: function() { return 'DAO created by ' + (creator || 'unknown'); },
          DaoRegistered: function() { return 'DAO registered for token ' + (tokenAddress || 'unknown'); },
          DaoFinalized: function() { return 'DAO finalized for token ' + (tokenAddress || 'unknown'); },
          ImplementationRegistered: function() { return 'Implementation "' + (name || 'unknown') + '" registered'; },
          SeedGenerated: function() { return 'Seed generated for token ' + (tokenId || 'unknown'); },
          PropertyAdded: function() { return 'Property "' + (name || 'unknown') + '" added'; }
        };

        var summary = summaryFunctions[normalizedEventName] ? summaryFunctions[normalizedEventName]() : (titleMap[normalizedEventName] || String(eventName).replace(/_/g, ' '));

        // Ensure consistent string representation for JSON fields to avoid Arrow type inference issues
        var topicsValue = topics;
        if (typeof topicsValue === 'string') {
          // Validate it's valid JSON
          try {
            JSON.parse(topicsValue);
          } catch (e) {
            topicsValue = '{}';
          }
        } else {
          topicsValue = JSON.stringify(topicsValue || {});
        }

        var argsValue = args;
        if (typeof argsValue === 'string') {
          // Validate it's valid JSON
          try {
            JSON.parse(argsValue);
          } catch (e) {
            argsValue = '{}';
          }
        } else {
          argsValue = JSON.stringify(argsValue || {});
        }

        // Strictly type all fields to ensure no mixed types in Arrow table
        var visibility = userFacing[normalizedEventName] ? (normalizedEventName.indexOf('Proposal') === 0 || normalizedEventName === 'VoteCast' ? 'governance' : 'public') : (kindMap[normalizedEventName] ? 'admin' : 'system');

        // Helper to safely convert to number
        function toNumber(val) {
          if (typeof val === 'number') return isFinite(val) ? val : 0;
          var n = Number(val);
          return isFinite(n) ? n : 0;
        }

        // Helper to safely convert to string
        function toString(val) {
          if (val === null || val === undefined || val === '') return '';
          return String(val);
        }

        return {
          activity_id: toString(data.event_id || data.id),  // Primary key - derived from source event_id
          deployment_id: toString(data.deployment_id),
          contract_id: toString(data.contract_id),
          contract_role: toString(data.contract_role),
          kind: toString(kindMap[normalizedEventName] || ('contract.' + String(eventName).toLowerCase())),
          title: toString(titleMap[normalizedEventName] || normalizedEventName),
          summary: toString(summary),
          event_name: toString(eventName),
          topics: toString(topicsValue),
          args: toString(argsValue),
          visibility: toString(visibility),
          proposal_id: toString(proposalId),
          token_id: toString(tokenId),
          amount: toString(amount),
          actor: toString(pick(data, ['actor', 'proposer', 'voter', 'bidder', 'minter', 'owner', 'changed_by', 'cancelled_by', 'executor', 'governor', 'treasury', 'new_treasury', 'new_governor', 'delegator', 'delegate', 'creator'])),
          addresses: JSON.stringify(addresses || []),
          ledger_sequence: ledger_sequence,
          transaction_index: transaction_index,
          operation_index: operation_index,
          event_index: event_index,
          ledger_closed_at: toString(data.ledger_closed_at),
          transaction_hash: toString(data.transaction_hash)
        };
        } catch (e) {
          console.error('Activity feed transform error:', e.message, 'event_id:', data?.event_id);
          return null;
        }
      }

  decoded_events_with_jsonb:
    type: sql
    primary_key: event_id
    sql: |
      SELECT
        event_id,
        deployment_id,
        contract_id,
        contract_role,
        event_name,
        topic_0,
        topic_1,
        topic_2,
        topic_3,
        topics::jsonb as topics,
        args::jsonb as args,
        transaction_hash,
        transaction_successful,
        ledger_sequence,
        ledger_hash,
        ledger_closed_at,
        transaction_index,
        operation_index,
        event_index,
        operation_type,
        _gs_op,
        decoder_version
      FROM decoded_events

  activity_feed_with_jsonb:
    type: sql
    primary_key: activity_id
    sql: |
      SELECT
        activity_id,
        deployment_id,
        contract_id,
        contract_role,
        event_name,
        topics::jsonb as topics,
        args::jsonb as args,
        kind,
        title,
        summary,
        visibility,
        proposal_id,
        token_id,
        amount,
        actor,
        addresses::jsonb as addresses,
        ledger_sequence,
        transaction_index,
        operation_index,
        event_index,
        ledger_closed_at,
        transaction_hash
      FROM activity_feed

sinks:
  raw_events_output:
    type: postgres
    from: raw_events
    schema: chain
    table: raw_events
    secret_name: STELLAR_BUILDER_POSTGRES
    primary_key: event_id

  decoded_events_output:
    type: postgres
    from: decoded_events_with_jsonb
    schema: chain
    table: decoded_events
    secret_name: STELLAR_BUILDER_POSTGRES
    primary_key: event_id

  activity_feed_output:
    type: postgres
    from: activity_feed_with_jsonb
    schema: app
    table: activity_feed_events
    secret_name: STELLAR_BUILDER_POSTGRES
    primary_key: activity_id
