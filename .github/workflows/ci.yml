name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

# Read-only by default: no job here writes to the repository, its releases or its packages.
permissions:
  contents: read

env:
  SOROBAN_SDK_BUILD_SYSTEM_SUPPORTS_SPEC_SHAKING_V2: '0'
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Actions are pinned by commit SHA (the tag is in the comment) so a moved tag cannot change what runs.
# Dependabot updates them (.github/dependabot.yml).
jobs:
  rust-checks:
    name: Rust Checks and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Rustup ships on ubuntu-latest; the repo allows only GitHub-owned actions plus a short list,
      # so the toolchain and cache are set up without third-party Rust actions. The version,
      # components and target come from rust-toolchain.toml, the same compiler the release build uses.
      - name: Setup Rust toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy --target wasm32v1-none
          rustc --version

      - name: Cache Cargo dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Check Rust formatting
        run: cargo fmt --all --check

      # --locked everywhere: a build fails instead of silently changing Cargo.lock.
      - name: Run Clippy linting
        run: cargo clippy --locked --all-targets --all-features -- -D warnings -A clippy::too_many_arguments -A clippy::upper_case_acronyms

      # `stellar contract build` is how the contracts ship: it shakes unused spec entries out of the
      # WASM, which keeps Token under the 128 KiB network code limit (plain `cargo build` leaves it at
      # ~165 KiB and the e2e uploads fail). Installed from the pinned release, checksum verified, since
      # no allowed action installs it. docker/wasm-build/Dockerfile pins the same archive.
      - name: Install Stellar CLI
        env:
          STELLAR_CLI_VERSION: 28.0.0
          STELLAR_CLI_SHA256: 207544486734fccb4df1afc4a7745478f9f1e21688b2f9506f0ef36f60ce3fdc
        run: |
          archive="stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/${archive}"
          echo "${STELLAR_CLI_SHA256}  ${archive}" | sha256sum --check
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$archive" -C "$HOME/.local/bin" stellar
          rm "$archive"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The CLI sets the spec-shaking flag itself; the workflow-wide '0' is only for the plain cargo
      # steps (clippy and tests), so it is unset here.
      - name: Build all contracts
        run: env -u SOROBAN_SDK_BUILD_SYSTEM_SUPPORTS_SPEC_SHAKING_V2 stellar contract build --locked

      - name: Run all tests
        run: cargo test --locked

  typescript-checks:
    name: TypeScript Checks
    runs-on: ubuntu-latest

    # For db/test-migrations.sh: migrations up, re-run, rollback, up, then the Goldsky
    # read-model integration test against the real views (needs CREATEDB).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The pnpm version comes from packageManager in package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      # Node LTS, from .nvmrc. setup-node caches the pnpm store; the install below always runs, so a
      # cached node_modules can never stand in for the lockfile.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate web clients and styles
        run: pnpm --dir apps/web codegen

      - name: Run ESLint
        run: pnpm --dir apps/web lint

      - name: Run TypeScript type checking
        run: pnpm --dir apps/web typecheck

      - name: Type check the shared design tokens and glossary
        run: |
          pnpm --dir packages/design-tokens typecheck
          pnpm --dir packages/glossary typecheck

      - name: Generate docs styles
        run: pnpm --dir apps/docs codegen

      - name: Lint, type check and test the docs
        run: |
          pnpm --dir apps/docs lint
          pnpm --dir apps/docs typecheck
          pnpm --dir apps/docs test

      - name: Run web tests
        run: pnpm --dir apps/web test

      - name: Run Goldsky tests
        run: pnpm --dir packages/goldsky test

      # The walkthrough harness's own unit tests (signer, waits, preflight). The walkthroughs
      # themselves run against testnet from a maintainer's machine (docs/qa/WALKTHROUGHS.md).
      - name: Type-check and test the walkthrough harness
        run: |
          pnpm --dir apps/e2e typecheck
          pnpm --dir apps/e2e test

      - name: Run script tests
        run: node --test scripts/*.test.mjs

      - name: Run database migrations and the read-model integration test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: pnpm db:test

  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      # The whole history, so a secret committed and later deleted is still found.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # No allowed action installs gitleaks, so the release binary is installed directly, checksum
      # verified. lefthook runs the same scan on staged changes before each commit.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$archive" -C "$HOME/.local/bin" gitleaks
          rm "$archive"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # .gitleaks.toml extends the default rules and allows public Stellar account and contract
      # addresses, which look like keys to the generic rule.
      - name: Scan the history for secrets
        run: gitleaks git --redact --no-banner --verbose .

  build:
    name: Build Web
    runs-on: ubuntu-latest
    needs: [rust-checks, typescript-checks]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Also runs apps/web/scripts/assert-e2e-wallet.mjs: the build fails if the test-only
      # E2E Wallet is in it.
      - name: Build Next.js app
        run: pnpm build

      # docs.tribes.build: the static export plus its Pagefind index, then every page at
      # 375, 768 and 1440px in light and dark (axe, horizontal scroll, console errors) and
      # the keyboard and touch states (docs plan §5.4c).
      - name: Build the docs site
        run: pnpm docs:build

      - name: Install Chromium for the docs checks
        run: pnpm --dir apps/docs exec playwright-core install --with-deps chromium

      - name: Check every docs page in both themes
        run: pnpm docs:check
