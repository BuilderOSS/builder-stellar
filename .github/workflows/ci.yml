name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

env:
  SOROBAN_SDK_BUILD_SYSTEM_SUPPORTS_SPEC_SHAKING_V2: '0'
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust-checks:
    name: Rust Checks and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Rustup ships on ubuntu-latest; the repo allows only GitHub-owned actions plus a short list,
      # so the toolchain and cache are set up without third-party Rust actions.
      - name: Setup Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustup target add wasm32v1-none
          rustc --version

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Run Clippy linting
        run: cargo clippy --all-targets --all-features -- -D warnings -A clippy::too_many_arguments -A clippy::upper_case_acronyms

      # `stellar contract build` is how the contracts ship: it shakes unused spec entries out of the
      # WASM, which keeps Token under the 128 KiB network code limit (plain `cargo build` leaves it at
      # ~165 KiB and the e2e uploads fail). Installed from the pinned release, checksum verified, since
      # no allowed action installs it.
      - name: Install Stellar CLI
        env:
          STELLAR_CLI_VERSION: 28.0.0
          STELLAR_CLI_SHA256: 207544486734fccb4df1afc4a7745478f9f1e21688b2f9506f0ef36f60ce3fdc
        run: |
          archive="stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/${archive}"
          echo "${STELLAR_CLI_SHA256}  ${archive}" | sha256sum --check
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$archive" -C "$HOME/.local/bin" stellar
          rm "$archive"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The CLI sets the spec-shaking flag itself; the workflow-wide '0' is only for the plain cargo
      # steps (clippy and tests), so it is unset here.
      - name: Build all contracts
        run: env -u SOROBAN_SDK_BUILD_SYSTEM_SUPPORTS_SPEC_SHAKING_V2 stellar contract build

      - name: Run all tests
        run: cargo test

  typescript-checks:
    name: TypeScript Checks
    runs-on: ubuntu-latest

    # For db/test-migrations.sh: migrations up, re-run, rollback, up, then the Goldsky
    # read-model integration test against the real views (needs CREATEDB).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '23'
          cache: 'pnpm'

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-node23-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Generate web clients and styles
        run: pnpm --dir apps/web codegen

      - name: Run ESLint
        run: pnpm --dir apps/web lint

      - name: Run TypeScript type checking
        run: pnpm --dir apps/web typecheck

      - name: Run web tests
        run: pnpm --dir apps/web test

      - name: Run Goldsky tests
        run: pnpm --dir packages/goldsky test

      - name: Run database migrations and the read-model integration test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: pnpm db:test

  build:
    name: Build Web
    runs-on: ubuntu-latest
    needs: [rust-checks, typescript-checks]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '23'
          cache: 'pnpm'

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-node23-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Build Next.js app
        run: pnpm build
